<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<title>분리수거 검사관 v2</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div id="app">

  <!-- ══════ 홈 (임시 — 3단계에서 튜토리얼·연출로 대체) ══════ -->
  <section id="home" class="screen">
    <div class="home-card">
      <h1 class="title">분리수거<br/>검사관 <span class="v2badge">v2</span></h1>
      <p class="tag">재활용이를 튜닝하고, 도전으로 실력을 확인하세요</p>
      <div class="row center">
        <label class="cnt">도전 범위</label>
        <select id="stageSel">
          <option value="1">1단계 (20종)</option>
          <option value="2">2단계 (45종)</option>
          <option value="3">3단계 (72종)</option>
          <option value="4" selected>전체 (100종)</option>
        </select>
        <select id="todaySel"></select>
      </div>
      <button id="challengeBtn" class="big">🚛 도전 시작!</button>
      <button id="notebookBtn" class="big ghost">📒 알바 수첩</button>
      <div id="homeStats" class="home-stats"></div>
      <button id="resetBtn" class="reset-link">🔄 처음부터 (기록 삭제)</button>
    </div>
  </section>

  <!-- ══════ 정산 (간이 — 3단계에서 근무 연출 추가) ══════ -->
  <section id="report" class="screen hidden">
    <div class="report-card">
      <h2>🚛 도전 결과</h2>
      <div class="score-row"><span id="score" class="score-big">0점</span>
        <span id="scoreSub" class="cnt"></span></div>
      <div id="srcStats" class="src-stats"></div>
      <div class="wrong-title">❌ 재활용이가 틀린 것 — 눌러서 가르쳐 주세요
        <span id="teachBudget" class="budget"></span></div>
      <div id="wrongList" class="wrong-list"></div>
      <div id="ruleReport" class="rule-report"></div>
      <div class="row center" style="margin-top:12px">
        <button id="reportNotebook" class="big ghost">📒 수첩 튜닝</button>
        <button id="reportRetry" class="big">🚛 다시 도전!</button>
        <button id="reportHome" class="big ghost">🏠</button>
      </div>
    </div>
  </section>

  <!-- ══════ 알바 수첩 (두 탭) ══════ -->
  <div id="nbOverlay" class="overlay hidden">
    <div class="nb-card">
      <div class="nb-tabs">
        <button id="tabItems" class="nb-tab active">📒 물건</button>
        <button id="tabFeats" class="nb-tab">📐 규칙</button>
      </div>

      <!-- 물건 탭 -->
      <div id="paneItems" class="nb-pane">
        <p class="sub">재활용이가 <b>낱개로 외운</b> 물건들이에요. 새로 가르치는 건 <b>도전에서 틀렸을 때</b>(한 번에 3개까지)!</p>
        <div id="itemCols" class="item-cols"></div>
        <div class="mystery-title">❓ 아직 모르는 물건</div>
        <div id="mysteryRow" class="mystery-row"></div>
      </div>

      <!-- 특징(규칙) 탭 -->
      <div id="paneFeats" class="nb-pane hidden">
        <p class="sub">공통점으로 묶어서 가르쳐요 — <b>특징을 골라 규칙을 만들면</b>, 처음 보는 물건도 분류할 수 있어요!</p>
        <div class="rule-title">📐 공통점 규칙 <span id="slotGauge" class="slot-gauge"></span></div>
        <div class="rule-builder">
          <div id="ruleChips" class="chips"></div>
          <div id="rulePreview" class="feat-agg"></div>
          <div class="row">→ <select id="ruleCat"></select>
            <button id="ruleAdd" class="small">규칙 만들기</button></div>
        </div>
        <div id="ruleCards"></div>
      </div>

      <!-- 방침 (하단 고정) -->
      <div class="policy-zone">
        <div class="rule-title">🧭 방침 — 모르는 물건이 나오면?</div>
        <div id="policyRow" class="chips"></div>
      </div>
      <button id="nbClose" class="small ghost">덮기</button>
    </div>
  </div>

  <!-- ══════ 속성 확인 팝업 ══════ -->
  <div id="inspect" class="overlay hidden">
    <div class="teach-card">
      <div id="inspectName" class="teach-name"></div>
      <div id="inspectCat" class="sub"></div>
      <div id="inspectAttrs" class="chips ro"></div>
      <button id="inspectClose" class="small ghost">닫기</button>
    </div>
  </div>

  <!-- ══════ 가르치기 모달 ══════ -->
  <div id="teach" class="overlay hidden">
    <div class="teach-card">
      <div id="teachName" class="teach-name"></div>
      <button id="teachInspect" class="inspect-toggle">🔍 속성 보기</button>
      <div id="teachAttrs" class="chips ro hidden"></div>
      <p class="sub">이건 무엇으로 가르쳐줄까요?</p>
      <div class="cat-btns">
        <button data-cat="paper" class="cat-btn c-paper">종이류</button>
        <button data-cat="can" class="cat-btn c-can">캔류</button>
        <button data-cat="food" class="cat-btn c-food">음식물</button>
        <button data-cat="plastic" class="cat-btn c-plastic">플라스틱류</button>
        <button data-cat="trash" class="cat-btn c-trash">❌ 재활용 안 됨</button>
      </div>
      <button id="teachCancel" class="small ghost">그만두기</button>
    </div>
  </div>

</div>
<script type="module" src="./game.js"></script>
</body>
</html>
